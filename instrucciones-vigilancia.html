<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recados a Vigilancia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles/instrucciones-vigilancia.css">
</head>
<body>
    <!-- 🔐 Validación de autenticación -->
    <script>
        const userData = sessionStorage.getItem('userData');
        if (!userData) {
            window.location.href = 'index.html';
        }
    </script>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-walkie-talkie"></i> RECADOS A VIGILANCIA</h1>
            <p class="subtitle">Sistema de comunicación con el personal de seguridad</p>
        </div>

        <!-- Contenido principal -->
        <div class="main-content">
            <!-- Panel izquierdo - Lista de casas -->
            <div class="panel left-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-home"></i> LISTA DE CASAS</h2>
                    <div class="search-box">
                        <input type="text" id="searchHouses" placeholder="Buscar casa...">
                        <i class="fas fa-search"></i>
                    </div>
                </div>
                
                <div class="houses-list">
                    <!-- Ejemplo de casas (se llenará dinámicamente) -->
                    
                </div>
            </div>

            <!-- Panel derecho - Recados -->
            <div class="panel right-panel">
                <div class="panel-header">
                    <h2><i class="fas fa-clipboard-list"></i> RECADOS REGISTRADOS</h2>
                    <button class="btn-add" id="btnAddMessage">
                        <i class="fas fa-plus"></i> NUEVO RECADO
                    </button>
                </div>
                
                <div class="messages-list">
                    
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para nuevo recado -->
    <div id="modalNuevoRecado" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle"></i> NUEVO RECADO</h3>
                <span class="close" data-modal="modalNuevoRecado">&times;</span>
            </div>
            <div class="modal-body">
                <form id="formNuevoRecado">
                    <input type="hidden" id="nuevoIdCasa">

                    <div class="form-group">
                        <label for="nuevoFechaInicio"><i class="fas fa-calendar-alt"></i> Fecha de Inicio:</label>
                        <input type="date" id="nuevoFechaInicio" required class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="nuevoFechaFin"><i class="fas fa-calendar-check"></i> Fecha de Fin:</label>
                        <input type="date" id="nuevoFechaFin" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="nuevoRecado"><i class="fas fa-sticky-note"></i> Recado:</label>
                        <textarea id="nuevoRecado" rows="4" required class="form-control" placeholder="Escribe el recado aquí..."></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-cancelar" data-modal="modalNuevoRecado">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        
                        <button type="submit" class="btn-guardar">
                            <i class="fas fa-save"></i> Guardar Recado
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- Modal para editar recado -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-edit"></i> EDITAR RECADO</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="formEditarRecado">
                    <input type="hidden" id="editIdRecado">
                    <input type="hidden" id="editIdCasa">

                    <div class="form-group">
                        <label for="editFechaInicio"><i class="fas fa-calendar-alt"></i> Fecha de Inicio:</label>
                        <input type="date" id="editFechaInicio" required class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="editFechaFin"><i class="fas fa-calendar-check"></i> Fecha de Fin:</label>
                        <input type="date" id="editFechaFin" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="editRecado"><i class="fas fa-sticky-note"></i> Recado:</label>
                        <textarea id="editRecado" rows="4" required class="form-control" placeholder="Escribe el recado aquí..."></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn-cancelar" id="btnCancelarEdicion">
                            <i class="fas fa-times"></i> Cancelar
                        </button>
                        
                        <button type="submit" class="btn-guardar">
                            <i class="fas fa-save"></i> Guardar Cambios
                        </button>

                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Container para las alertas -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="scripts/config.js"></script>
    <script src="scripts/instrucciones-vigilancia.js"></script>
</body>
</html>
